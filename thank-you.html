<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You – Eagle International packers and movers</title>
  <link rel="icon" type="image/png" href="images/logo%20.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/animations.css" rel="stylesheet">
  <style>
    .thank-you-page-font { font-family: 'Plus Jakarta Sans', var(--font-family); }
    .thank-you-section {
      min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 3rem 0;
      background: linear-gradient(160deg, #f0f7ff 0%, #e8f5e9 50%, #f5f5f5 100%);
      position: relative; overflow: hidden;
    }
    .thank-you-section::before {
      content: ""; position: absolute; top: -50%; left: -20%; width: 60%; height: 80%;
      background: radial-gradient(circle, rgba(13, 110, 253, 0.06) 0%, transparent 70%);
      pointer-events: none;
    }
    .thank-you-section::after {
      content: ""; position: absolute; bottom: -30%; right: -15%; width: 50%; height: 60%;
      background: radial-gradient(circle, rgba(25, 135, 84, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .thank-you-card {
      max-width: 56rem; margin: 0 auto; text-align: center; padding: 3.25rem 3rem;
      border-radius: 1.25rem; background: #fff;
      box-shadow: 0 0.25rem 1rem rgba(0,0,0,0.06), 0 1rem 2.5rem rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.06); border-top: 3px solid var(--color-success);
      position: relative; z-index: 1; overflow: visible;
      animation: thank-you-card-in 0.6s ease-out forwards;
      opacity: 0;
    }
    .thank-you-burst { position: absolute; top: 50%; left: 50%; width: 0; height: 0; pointer-events: none; z-index: 0; }
    .thank-you-burst span {
      position: absolute; left: 0; top: 0; font-size: 1.5rem; line-height: 1;
      animation: thank-you-burst 1.4s ease-out forwards; opacity: 0;
    }
    .thank-you-burst span:nth-child(1){ animation-delay: 0.72s; --dx: 5rem; --dy: 0; }
    .thank-you-burst span:nth-child(2){ animation-delay: 0.67s; --dx: 4.33rem; --dy: -2.5rem; }
    .thank-you-burst span:nth-child(3){ animation-delay: 0.77s; --dx: 2.5rem; --dy: -4.33rem; }
    .thank-you-burst span:nth-child(4){ animation-delay: 0.7s; --dx: 0; --dy: -5rem; }
    .thank-you-burst span:nth-child(5){ animation-delay: 0.74s; --dx: -2.5rem; --dy: -4.33rem; }
    .thank-you-burst span:nth-child(6){ animation-delay: 0.68s; --dx: -4.33rem; --dy: -2.5rem; }
    .thank-you-burst span:nth-child(7){ animation-delay: 0.76s; --dx: -5rem; --dy: 0; }
    .thank-you-burst span:nth-child(8){ animation-delay: 0.72s; --dx: -4.33rem; --dy: 2.5rem; }
    .thank-you-burst span:nth-child(9){ animation-delay: 0.66s; --dx: -2.5rem; --dy: 4.33rem; }
    .thank-you-burst span:nth-child(10){ animation-delay: 0.78s; --dx: 0; --dy: 5rem; }
    .thank-you-burst span:nth-child(11){ animation-delay: 0.69s; --dx: 2.5rem; --dy: 4.33rem; }
    .thank-you-burst span:nth-child(12){ animation-delay: 0.73s; --dx: 4.33rem; --dy: 2.5rem; }
    .thank-you-burst span:nth-child(13){ animation-delay: 0.71s; --dx: 3.53rem; --dy: -3.53rem; }
    .thank-you-burst span:nth-child(14){ animation-delay: 0.75s; --dx: -3.53rem; --dy: -3.53rem; }
    .thank-you-burst span:nth-child(15){ animation-delay: 0.67s; --dx: -3.53rem; --dy: 3.53rem; }
    .thank-you-burst span:nth-child(16){ animation-delay: 0.77s; --dx: 3.53rem; --dy: 3.53rem; }
    .thank-you-burst span:nth-child(17){ animation-delay: 0.7s; --dx: 4.5rem; --dy: -1.2rem; }
    .thank-you-burst span:nth-child(18){ animation-delay: 0.74s; --dx: -4.5rem; --dy: 1.2rem; }
    @keyframes thank-you-burst {
      from { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
      to { opacity: 0; transform: translate(calc(-50% + var(--dx, 0)), calc(-50% + var(--dy, 0))) scale(0.5); }
    }
    .thank-you-icon-wrap { position: relative; margin-bottom: 1.5rem; }
    .thank-you-icon {
      width: 5rem; height: 5rem; margin: 0 auto; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: linear-gradient(135deg, var(--color-success) 0%, #20c997 100%);
      color: #fff; font-size: 2.5rem; box-shadow: 0 0.5rem 1.25rem rgba(25, 135, 84, 0.35);
      animation: thank-you-icon-in 0.5s ease-out 0.25s forwards;
      opacity: 0; transform: scale(0.3); position: relative; z-index: 1;
    }
    .thank-you-icon i { animation: thank-you-check 0.4s ease-out 0.6s forwards; opacity: 0; }
    .thank-you-title {
      font-size: 1.85rem; font-weight: 700; color: var(--color-text-dark); margin-bottom: 0.5rem;
      animation: thank-you-fade-up 0.5s ease-out 0.4s forwards;
      opacity: 0; transform: translateY(1rem);
    }
    .thank-you-tagline {
      font-size: 1.15rem; color: var(--color-primary); font-weight: 600; margin-bottom: 1rem; line-height: 1.5;
      animation: thank-you-fade-up 0.5s ease-out 0.5s forwards;
      opacity: 0; transform: translateY(1rem);
    }
    .thank-you-text {
      color: var(--color-text-muted); font-size: 1.05rem; line-height: 1.65; margin-bottom: 1.75rem;
      animation: thank-you-fade-up 0.5s ease-out 0.55s forwards;
      opacity: 0; transform: translateY(1rem);
    }
    .thank-you-btn {
      padding: 0.65rem 1.75rem; border-radius: 0.35rem 0 0.35rem 0; font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: thank-you-fade-up 0.5s ease-out 0.7s forwards;
      opacity: 0; transform: translateY(1rem);
    }
    .thank-you-btn:hover { transform: translateY(-2px); box-shadow: 0 0.35rem 0.75rem rgba(25, 135, 84, 0.3); }
    @keyframes thank-you-card-in {
      from { opacity: 0; transform: translateY(1.5rem) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes thank-you-icon-in {
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes thank-you-check {
      to { opacity: 1; }
    }
    @keyframes thank-you-fade-up {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body data-page="thank-you">
  <div id="navbar-container"></div>
  <div id="floating-contact-container"></div>

  <section class="thank-you-section">
    <div class="container">
      <div class="thank-you-card thank-you-page-font">
        <div class="thank-you-icon-wrap">
          <div class="thank-you-burst" aria-hidden="true">
            <span>🎉</span><span>🎊</span><span>✨</span><span>🌟</span><span>💫</span><span>🎈</span>
            <span>🎉</span><span>🎊</span><span>✨</span><span>🌟</span><span>💫</span><span>🎈</span>
            <span>🎀</span><span>⭐</span><span>🎀</span><span>⭐</span><span>🎉</span><span>✨</span>
          </div>
          <div class="thank-you-icon"><i class="bi bi-check-lg"></i></div>
        </div>
        <h1 class="thank-you-title">Thanks for reaching out!</h1>
        <p class="thank-you-tagline">Leave your worries behind. Sit back and relax — we'll take care of the rest.</p>
        <p class="thank-you-text" id="thank-you-message">We have received your request and will get back to you shortly.</p>
        <a href="index.html" class="btn btn-success thank-you-btn">Back to Home</a>
      </div>
    </div>
  </section>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/sections.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var from = params.get("from");
      var el = document.getElementById("thank-you-message");
      if (el) {
        if (from === "quote") el.textContent = "We've got your quote request. Our team will call you soon with a free, no-obligation estimate for your move.";
        else if (from === "contact") el.textContent = "Your message is with us. We'll get back to you at the earliest — usually within a few hours.";
        else el.textContent = "We have received your request and will get back to you shortly.";
      }
    })();
  </script>
</body>
</html>
